# fly.toml — deploy with:  fly launch --no-deploy   then   fly deploy
app = "draft-advisor"
primary_region = "fra"   # Frankfurt: closest to the Supabase project (eu-central-1)

[build]

[env]
  PORT = "8787"
  REGIONS = "eun1,euw1"
  QUEUE_ID = "420"

# Secrets (never in this file):
#   fly secrets set RIOT_API_KEY=... DATABASE_URL=... DB_PASSWORD=...

[processes]
  api = "node --experimental-strip-types apps/api/src/index.ts"
  worker = "node --experimental-strip-types apps/ingest/src/cli.ts worker --batch 2000"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false      # the API caches aggregates in memory; restarts are expensive
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"                  # aggregates for four tier bands are held in memory
  processes = ["api"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]
